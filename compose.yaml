x-application: &application
  image: url-shortener:local
  pull_policy: never
  environment: &application-environment
    DATABASE_URL: postgresql+psycopg://shortener:${COMPOSE_POSTGRES_PASSWORD:?Set COMPOSE_POSTGRES_PASSWORD in .env.compose}@postgres:5432/url_shortener
    REDIS_URL: redis://redis:6379/0

x-runtime: &runtime
  <<: *application
  environment:
    <<: *application-environment
    METRICS_HOST: 0.0.0.0
    METRICS_PORT: "9100"
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17}
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: ${COMPOSE_POSTGRES_PASSWORD:?Set COMPOSE_POSTGRES_PASSWORD in .env.compose}
      POSTGRES_DB: url_shortener
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "shortener", "-d", "url_shortener"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: ${REDIS_IMAGE:-docker.arvancloud.ir/redis:8.8.4-alpine}
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    <<: *application
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-docker.arvancloud.ir/python:3.14-slim}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *runtime
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 6

  worker:
    <<: *runtime
    command: ["python", "-m", "url_shortener.worker"]
    scale: 2

  prometheus:
    image: ${PROMETHEUS_IMAGE:-docker.arvancloud.ir/prom/prometheus:v3.16.0}
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: ${GRAFANA_IMAGE:-docker.arvancloud.ir/grafana/grafana:13.2.6}
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${COMPOSE_GRAFANA_PASSWORD:?Set COMPOSE_GRAFANA_PASSWORD in .env.compose}
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - ./observability/grafana/provisioning/dashboards/url-shortener.yaml:/etc/grafana/provisioning/dashboards/url-shortener.yaml:ro
      - ./observability/grafana/provisioning/datasources/prometheus.yaml:/etc/grafana/provisioning/datasources/prometheus.yaml:ro
      - ./observability/grafana/dashboards:/var/lib/grafana-dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
